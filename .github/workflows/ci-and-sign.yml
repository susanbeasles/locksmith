name: CI, Supply-Chain Verification & Keyless OIDC Signing

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  verify:
    name: Adversarial TDD, Clippy, Fmt & Self-Test Gates
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout clean-room repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install build dependencies (clang, cmake, mold)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake mold pkg-config

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Enforce rustfmt gate
        run: cargo fmt --all -- --check

      - name: Enforce strict workspace clippy gate (-D warnings, forbid unsafe)
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Execute functional + adversarial red-team test suites
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: cargo test --workspace --all-targets --locked

      - name: Execute release binary startup KATs (verify-self)
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: |
          cargo build --locked --release -p locksmith-daemon
          ./target/release/locksmith-daemon verify-self

      - name: Validate POSIX /bin/sh syntax and immutable path hygiene of infra/forge
        run: |
          sh -n infra/forge
          if grep -En '[~]/[.]local' infra/forge infra/Dockerfile; then
            echo "Forbidden user-local path reference detected" >&2
            exit 1
          fi

  build-and-sign:
    name: Build Immutable OCI Image & Keyless Sigstore OIDC Sign
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout clean-room repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Authenticate to GitHub Container Registry (GHCR)
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Sigstore cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d02bc6ca5a610 # v3.8.1

      - name: Resolve immutable upstream base-image SHA-256 digests
        id: base_digests
        run: |
          BUILDER_DIGEST="$(docker buildx imagetools inspect docker.io/library/rust:1-bookworm --format '{{json .Manifest.Digest}}' | tr -d '"')"
          RUNTIME_DIGEST="$(docker buildx imagetools inspect gcr.io/distroless/cc-debian12:nonroot --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "builder=docker.io/library/rust:1-bookworm@${BUILDER_DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "runtime=gcr.io/distroless/cc-debian12:nonroot@${RUNTIME_DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Build and push GHCR image by immutable digest
        id: build_push
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.15.0
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          build-args: |
            BUILDER_IMAGE=${{ steps.base_digests.outputs.builder }}
            RUNTIME_IMAGE=${{ steps.base_digests.outputs.runtime }}
          provenance: false

      - name: Keyless Sigstore OIDC sign container image digest
        env:
          IMAGE_URI: ghcr.io/${{ github.repository }}@${{ steps.build_push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE_URI}"
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/ci-and-sign.yml@refs/heads/main" \
            "${IMAGE_URI}"

      - name: Emit SLSA build provenance attestation
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517eb1be # v2.2.3
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build_push.outputs.digest }}
          push-to-registry: true
